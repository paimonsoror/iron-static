<radialGradient id="g_ring_thick" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="58"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.68" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="0.82" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="0.92" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
