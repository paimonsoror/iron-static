<!-- IRON STATIC ui_kit sheet (density 1.0). Cell: x,y,w,h | 9-slice margin LR,TB | note
     panel_plate: 0,0,96,96 | 28,28 | chamfer 20 TL+BR, amber-dim edge, double line (brackets are separate)
     panel_plate_active: 104,0,96,96 | 28,28 | glow edge, same slice as panel_plate
     panel_inset: 208,0,96,96 | 24,24 | row background, recessed, chamfer 12
     tooltip_plate: 312,0,96,96 | 24,24 | tooltip, frame-colored edge, chamfer 12
     button_plate: 0,104,96,96 | 28,28 | normal
     button_plate_pressed: 104,104,96,96 | 28,28 | pressed: darker, inner top shadow (code also shifts content 4 px)
     button_plate_disabled: 208,104,96,96 | 28,28 | disabled: no amber
     button_plate_affordable: 312,104,96,96 | 28,28 | affordable: amber edge, inner glow (no fill tint: it read olive)
     tab_plate: 0,208,96,96 | 28,28 | tab, closed
     tab_plate_active: 104,208,96,96 | 28,28 | active: amber top bar + glow, open bottom (no bottom edge)
     button_plate_active: 416,104,96,96 | 28,28 | selected chip: neutral steel fill #1D2531 (no amber tint), AMBER_GLOW edge, inner glow, lit amber underline
     lock_mark: 416,208,32,32 | 0,0 | plateless padlock in TEXT_DIM, 1:1 or scaled; sits on button_plate_disabled (never red)
     hazard_stripe: 416,248,64,16 | 0,0 | amber/dark 45-degree stripes, period 16, seamless in x: StyleBoxTexture axis_stretch TILE (Foundry/MAX, boss WARNING banner)
     bar_frame: 208,208,96,40 | 16,16 | bar well; segments drawn inside by code (inset 6); min height 32
     bar_segment: 312,208,24,24 | 0,0 | neutral white, tinted by modulate; pitch 20 at 16 wide
     bar_segment_off: 344,208,24,24 | 0,0 | unlit segment
     bar_tick_minor: 376,208,8,16 | 0,0 | tick every 10%
     bar_tick_major: 392,208,8,24 | 0,0 | tick at 25/50/75
     bracket_corner: 0,312,48,48 | 0,0 | top-left L bracket, 3 px, legs 24; code flips for other corners
     divider: 56,312,96,8 | 16,0 | 3-slice horizontal: caps + uniform line
     9-slice cells fill their rect to the border (gutters between cells are 8 texels instead of a 4 texel bleed margin).
     Edge cells (between the corner margins) are uniform along the stretched axis. -->
