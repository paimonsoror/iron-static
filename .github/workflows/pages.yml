name: Pages

# Publishes the player-facing codex in site/ to GitHub Pages. Only site/ is published,
# never docs/. Pages must be enabled in the repo settings (Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install MkDocs
        run: pip install -r site/requirements.txt

      - name: Build (strict)
        working-directory: site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
